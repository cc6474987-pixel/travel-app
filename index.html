<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅遊 App">
<meta name="theme-color" content="#f7f4ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="shim.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Travel App 東京河口湖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: the Claude Design phone prototype; on desktop it sits in a phone frame beside the notes, on phones it fills the screen. */
:root{--ink:#221f1a;--paper:#f7f4ef;--sand:#e8e3da;--muted:#6f685e;--accent:oklch(0.52 0.14 40);color-scheme:light}
body{margin:0;background:var(--sand);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--ink)}a:hover{color:oklch(0.55 0.14 40)}
input{font-family:inherit}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.noscroll::-webkit-scrollbar{display:none}
.mobsim{display:none}
.screen *:not(input):not(textarea){-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:640px){
  html{box-sizing:border-box;height:100%}
  body,#app{height:100%}
  body{background:var(--paper)}
  .stage{display:block!important;padding:0!important;min-height:0!important;height:100%}
  .side{display:none!important}
  .frame{width:100%!important;height:100%!important;border-radius:0!important;padding:0!important;background:transparent!important;box-shadow:none!important}
  .screen{border-radius:0!important}
  .sbar{display:none!important}
  .sbar-sp{height:8px!important}
  .mobsim{display:flex}
  :root{padding-bottom:0!important}
  html,body{overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y}
  .noscroll{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  input,textarea,select{font-size:16px!important}
  .navbar{height:56px!important;padding:0 10px max(4px,calc(env(safe-area-inset-bottom,0px) - 26px))!important;box-sizing:content-box}
}
</style>
</head>
<body>
<template id="tpl">
<div class="stage" style="min-height:100vh;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:48px;padding:40px 24px;box-sizing:border-box">
  <div class="side" style="max-width:300px;display:flex;flex-direction:column;gap:18px">
    <div style="font:500 11px 'JetBrains Mono',monospace;letter-spacing:.08em;color:#6f685e">TRAVEL APP · 互動原型</div>
    <div style="font:700 30px/1.25 'Noto Sans TC',sans-serif;text-wrap:pretty">行前好規劃，<br>路上用得到。</div>
    <div style="font:400 14px/1.7 'Noto Sans TC';color:#4d473f;text-wrap:pretty">已匯入「東京河口湖7天行程」：7 天、6 人、所有交通段與備註。出發前排行程，出發當天自動切到「今日」。</div>
    <div style="font:400 12px/1.6 'Noto Sans TC';color:#6f685e">{{ modeNote }}</div>
  </div>

  <div class="frame" style="width:390px;height:844px;flex:none;border-radius:54px;background:#1b1915;padding:11px;box-sizing:border-box;box-shadow:0 30px 60px -20px rgba(40,30,20,.45)">
    <div class="screen" style="position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#f7f4ef;display:flex;flex-direction:column">
      <div class="sbar" style="height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font:600 15px 'JetBrains Mono',monospace">
        <span>{{ clock }}</span>
        <div style="width:110px;height:32px;border-radius:20px;background:#1b1915;margin-top:4px"></div>
        <span style="font-size:12px;white-space:nowrap">5G</span>
      </div>

      <div class="noscroll" style="scrollbar-width:none;flex:1;overflow-y:auto;overflow-x:hidden">

        <sc-if value="{{ isToday }}" hint-placeholder-val="{{ false }}">
          <div style="padding:8px 20px 28px;display:flex;flex-direction:column;gap:16px">
            <sc-if value="{{ isPreview }}"><div style="padding:10px 13px;border-radius:14px;background:oklch(0.97 0.02 255);border:1px solid oklch(0.85 0.05 255);font:400 12.5px/1.55 'Noto Sans TC';color:#4d473f">{{ previewNote }}</div></sc-if>
            <div style="display:flex;flex-direction:column;gap:6px">
              <div>
                <div style="font:500 12px 'JetBrains Mono',monospace;color:#6f685e">{{ todayHead }}</div>
                <div style="font:700 26px/1.3 'Noto Sans TC',sans-serif;margin-top:2px">{{ todayTitle }}</div>
              </div>
              <div style="display:flex;gap:6px;align-items:baseline">
                <div style="font:400 11px 'Noto Sans TC';color:#6f685e;white-space:nowrap">今晚住</div>
                <div style="font:500 12px/1.4 'Noto Sans TC'">{{ todayStay }}</div>
              </div>
            </div>

            <div style="background:oklch(0.52 0.14 40);color:#fff;border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span style="font:500 12px 'Noto Sans TC';opacity:.92">下一站 · {{ nextTime }} 抵達</span>
                <span style="font:500 11px 'JetBrains Mono',monospace;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:20px">建議出發 {{ leaveTime }}</span>
              </div>
              <div style="font:700 24px/1.25 'Noto Sans TC',sans-serif">{{ nextTitle }}</div>
              <div style="display:flex;align-items:baseline;gap:8px">
                <span style="font:600 40px/1 'JetBrains Mono',monospace;letter-spacing:-.02em">{{ countdown }}</span>
                <span style="font:400 13px 'Noto Sans TC';opacity:.9">{{ cdUnit }}</span>
              </div>
              <sc-if value="{{ hasLegs }}"><div style="display:flex;gap:6px">
                <sc-for list="{{ todayLegs }}" as="l" hint-placeholder-count="3">
                  <button onClick="{{ l.onClick }}" style="flex:1;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.45);background:{{ l.tBg }};color:{{ l.tColor }};font:500 12px 'Noto Sans TC';cursor:pointer;opacity:{{ l.opacity }};white-space:nowrap">{{ l.label }} {{ l.mins }}</button>
                </sc-for>
              </div></sc-if>
              <sc-if value="{{ hasRoute }}"><div style="background:rgba(0,0,0,.16);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
                <sc-for list="{{ route }}" as="r" hint-placeholder-count="4">
                  <div style="display:flex;gap:10px;align-items:flex-start">
                    <span style="flex:none;width:44px;font:600 11px 'JetBrains Mono',monospace;padding-top:2px;opacity:.85">{{ r.mins }}</span>
                    <div style="flex:1">
                      <div style="font:500 13.5px/1.4 'Noto Sans TC'">{{ r.t }}</div>
                      <div style="font:400 11.5px 'Noto Sans TC';opacity:.82">{{ r.s }}</div>
                    </div>
                  </div>
                </sc-for>
              </div></sc-if>
              <div style="display:flex;gap:8px">
                <a href="{{ nextNavUrl }}" target="_blank" rel="noopener" style="flex:1;height:46px;border:0;border-radius:13px;background:#fff;color:#221f1a;font:700 14px 'Noto Sans TC';cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none">Google 地圖導航</a>
                <button onClick="{{ delay30 }}" style="flex:none;height:46px;padding:0 16px;border:1px solid rgba(255,255,255,.5);border-radius:13px;background:transparent;color:#fff;font:500 14px 'Noto Sans TC';cursor:pointer">延後 30 分</button>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">
              <sc-for list="{{ quick }}" as="q" hint-placeholder-count="4">
                <button onClick="{{ q.onClick }}" style="border:1px solid rgba(34,31,26,.1);background:#fffdf9;border-radius:16px;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:#221f1a" style-active="transform:scale(.96)">
                  <span style="width:34px;height:34px;border-radius:11px;background:{{ q.color }};display:flex;align-items:center;justify-content:center;color:#fff;font:700 15px 'Noto Sans TC'">{{ q.glyph }}</span>
                  <span style="font:500 12px 'Noto Sans TC'">{{ q.label }}</span>
                </button>
              </sc-for>
            </div>

            <div style="border:1px solid oklch(0.62 0.12 85);background:oklch(0.97 0.025 85);border-radius:14px;padding:12px 14px;display:flex;gap:10px">
              <span style="flex:none;font:700 12px 'Noto Sans TC';color:oklch(0.45 0.1 85)">提醒</span>
              <span style="font:400 12.5px/1.55 'Noto Sans TC';color:#4d473f">{{ nextNote }}</span>
            </div>

            <div style="display:flex;flex-direction:column;gap:10px">
              <div style="display:flex;justify-content:space-between;align-items:baseline">
                <span style="font:700 16px 'Noto Sans TC'">今天接下來</span>
                <button onClick="{{ goPlan }}" style="border:0;background:none;font:500 12px 'Noto Sans TC';color:#6f685e;cursor:pointer">完整行程 →</button>
              </div>
              <sc-for list="{{ restToday }}" as="it" hint-placeholder-count="3">
                <div onClick="{{ it.open }}" style="display:flex;gap:12px;align-items:center;padding:12px 14px;background:#fffdf9;border:1px solid rgba(34,31,26,.1);border-radius:14px;cursor:pointer">
                  <span style="font:600 13px 'JetBrains Mono',monospace;width:42px">{{ it.time }}</span>
                  <span style="width:8px;height:8px;border-radius:50%;background:{{ it.color }};flex:none"></span>
                  <div style="flex:1;min-width:0">
                    <div style="font:500 14px 'Noto Sans TC'">{{ it.title }}</div>
                    <div style="font:400 11.5px 'Noto Sans TC';color:#6f685e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.sub }}</div>
                  </div>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ isPlan }}" hint-placeholder-val="{{ true }}">
          <div style="padding:8px 20px 28px;display:flex;flex-direction:column;gap:16px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
              <div>
                <div style="font:500 12px 'JetBrains Mono',monospace;color:#6f685e;white-space:nowrap">2026.11.11 – 11.17 · {{ nPeople }} 人</div>
                <div style="font:700 28px/1.3 'Noto Sans TC',sans-serif;margin-top:2px;white-space:nowrap">東京・河口湖 7 天</div>
              </div>
              <div onClick="{{ openPeople }}" title="編輯成員" style="display:flex;flex:none;padding:4px 0 0 10px;cursor:pointer">
                <sc-for list="{{ avatars }}" as="a" hint-placeholder-count="4">
                  <span style="width:24px;height:24px;border-radius:50%;background:{{ a.bg }};border:2px solid #f7f4ef;margin-left:-10px;font-size:10px;display:flex;align-items:center;justify-content:center;font:700 11px 'Noto Sans TC';color:#fff">{{ a.i }}</span>
                </sc-for>
              </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;background:#221f1a;color:#f7f4ef;border-radius:16px;padding:14px 16px">
              <span style="font:500 13px 'Noto Sans TC'">{{ statusLabel }}</span>
              <span style="font:600 18px 'JetBrains Mono',monospace">{{ statusValue }}</span>
            </div>
            <sc-if value="{{ isDraft }}">
              <div style="display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;background:oklch(0.97 0.02 255);border:1px solid oklch(0.85 0.05 255)">
                <span style="flex:1;font:400 12.5px/1.5 'Noto Sans TC';color:#4d473f"><b style="color:oklch(0.42 0.11 255)">{{ draftLabel }}</b> · 可直接拖曳、改交通與停留時間</span>
                <button onClick="{{ restoreTrip }}" style="flex:none;border:1px solid rgba(34,31,26,.18);background:transparent;border-radius:10px;padding:6px 10px;font:500 12px 'Noto Sans TC';cursor:pointer;color:#221f1a;white-space:nowrap">還原匯入行程</button>
              </div>
            </sc-if>
            <button onClick="{{ openPlanner }}" style="height:46px;border:1.5px dashed rgba(34,31,26,.25);border-radius:14px;background:transparent;font:500 14px 'Noto Sans TC';color:#221f1a;cursor:pointer">＋ 規劃新旅程（選目的地，AI 排草稿）</button>
            <div style="display:flex;align-items:center;gap:8px;font:400 12px 'Noto Sans TC';color:#4d473f"><span style="width:7px;height:7px;border-radius:50%;background:oklch(0.62 0.14 150);flex:none;animation:pulse 1.6s infinite"></span>{{ presence }}</div>
            <div class="noscroll" style="scrollbar-width:none;display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 2px">
              <sc-for list="{{ dayPills }}" as="d" hint-placeholder-count="5">
                <button onClick="{{ d.onClick }}" style="flex:none;border:1px solid {{ d.border }};background:{{ d.bg }};color:{{ d.color }};border-radius:14px;padding:8px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px">
                  <span style="font:600 13px 'JetBrains Mono',monospace">{{ d.label }}</span>
                  <span style="font:400 11px 'Noto Sans TC';opacity:.75">{{ d.sub }}</span>
                </button>
              </sc-for>
            </div>
            <sc-if value="{{ showAi }}">
              <div style="background:#fffdf9;border:1px solid oklch(0.56 0.11 255);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;animation:fade .3s">
                <div style="display:flex;gap:8px;align-items:flex-start"><span style="font:700 10.5px/1.6 'Noto Sans TC';color:#fff;background:oklch(0.5 0.11 255);padding:1px 8px;border-radius:8px;flex:none;white-space:nowrap">順路建議</span><span style="flex:1;min-width:0;font:500 13.5px/1.45 'Noto Sans TC'">{{ ai.title }}</span></div>
                <div style="font:400 12px/1.55 'Noto Sans TC';color:#4d473f">{{ ai.body }}</div>
                <div style="display:flex;gap:8px">
                  <button onClick="{{ ai.apply }}" style="border:0;background:oklch(0.5 0.11 255);color:#fff;border-radius:10px;padding:7px 14px;font:500 12.5px 'Noto Sans TC';cursor:pointer;white-space:nowrap">{{ ai.applyLabel }}</button>
                  <button onClick="{{ ai.dismiss }}" style="border:1px solid rgba(34,31,26,.15);background:transparent;color:#4d473f;border-radius:10px;padding:7px 14px;font:500 12.5px 'Noto Sans TC';cursor:pointer;white-space:nowrap">略過</button>
                </div>
              </div>
            </sc-if>
            <a href="{{ dayMapUrl }}" target="_blank" rel="noopener" style="height:132px;border-radius:16px;border:1px solid rgba(34,31,26,.1);background:repeating-linear-gradient(135deg,#efe9df 0 10px,#e8e1d5 10px 20px);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:6px;padding:10px 12px;box-sizing:border-box;text-decoration:none">
              <span style="font:500 11px 'JetBrains Mono',monospace;color:#6f685e;background:#f7f4efcc;padding:3px 7px;border-radius:6px;white-space:nowrap">地圖：{{ dayCity }} 當日路線 ↗</span>
              <span style="font:500 11px 'JetBrains Mono',monospace;color:#4d473f;background:#f7f4efcc;padding:3px 7px;border-radius:6px;white-space:nowrap">{{ dayStats }}</span>
            </a>
            <div style="font:400 11.5px 'Noto Sans TC';color:#6f685e;margin:-6px 0 -4px">長按卡片拖曳排序 · 放開後時間自動重排</div>
            <div style="display:flex;flex-direction:column">
              <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
                <div data-row="1" style="display:flex;gap:10px;position:relative;user-select:none;-webkit-user-select:none;transform:{{ it.tf }};transition:{{ it.tr }};z-index:{{ it.z }}">
                  <div style="width:44px;flex:none;padding-top:15px;font:600 13px 'JetBrains Mono',monospace;opacity:{{ it.opacity }}">{{ it.time }}</div>
                  <div style="flex:none;width:12px;display:flex;flex-direction:column;align-items:center">
                    <div style="width:8px;height:8px;border-radius:50%;margin-top:19px;background:{{ it.dot }};border:2px solid {{ it.color }};flex:none"></div>
                    <div style="flex:1;width:2px;background:rgba(34,31,26,.1);margin-top:2px"></div>
                  </div>
                  <div style="flex:1;min-width:0;padding-bottom:4px">
                    <div onClick="{{ it.open }}" onPointerDown="{{ it.down }}" onTouchStart="{{ it.tdown }}" onContextMenu="{{ noCtx }}" style="background:#fffdf9;border:1px solid {{ it.border }};border-radius:14px;padding:11px 14px;cursor:{{ it.cursor }};opacity:{{ it.opacity }};box-shadow:{{ it.shadow }};touch-action:pan-y;transition:box-shadow .15s;position:relative;padding-right:40px" style-hover="background:#fff">
                      <sc-if value="{{ it.canDrag }}"><div onTouchStart="{{ it.gdown }}" onPointerDown="{{ it.gpdown }}" onClick="{{ stopClick }}" aria-label="拖曳調整順序" style="position:absolute;top:0;right:0;bottom:0;width:38px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;color:rgba(34,31,26,.35);font:700 15px/1 system-ui;letter-spacing:-2px">⋮⋮</div></sc-if>
                      <div style="display:flex;align-items:center;gap:6px">
                        <span style="font:500 11px 'Noto Sans TC';color:{{ it.color }};white-space:nowrap">{{ it.type }}</span>
                        <sc-if value="{{ it.isNext }}"><span style="font:700 10.5px 'Noto Sans TC';color:#fff;background:oklch(0.52 0.14 40);padding:1px 7px;border-radius:10px;white-space:nowrap">下一站</span></sc-if>
                        <sc-if value="{{ it.done }}"><span style="font:500 10.5px 'Noto Sans TC';color:#6f685e;white-space:nowrap">✓ 已完成</span></sc-if>
                        <span style="margin-left:auto;font:500 11px 'JetBrains Mono',monospace;color:#6f685e;white-space:nowrap">{{ it.stayLabel }}</span>
                      </div>
                      <div style="font:600 15px/1.35 'Noto Sans TC';margin-top:3px">{{ it.title }}</div>
                      <div style="font:400 12px/1.5 'Noto Sans TC';color:#6f685e;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ it.sub }}</div>
                      <sc-if value="{{ it.hasWarn }}"><div style="font:500 11.5px/1.5 'Noto Sans TC';color:oklch(0.48 0.14 35);margin-top:4px">! {{ it.warnShort }}</div></sc-if>
                    </div>
                    <sc-if value="{{ it.hasMove }}"><div style="display:flex;align-items:center;gap:5px;padding:7px 0 6px">
                      <span style="font:500 11px 'JetBrains Mono',monospace;color:#6f685e;width:10px;flex:none">↓</span>
                      <sc-for list="{{ it.legs }}" as="l" hint-placeholder-count="3"><button onClick="{{ l.onClick }}" style="height:26px;padding:0 9px;border-radius:13px;border:1px solid {{ l.border }};background:{{ l.bg }};color:{{ l.color }};font:500 11px 'Noto Sans TC';cursor:pointer;white-space:nowrap;opacity:{{ l.opacity }}">{{ l.label }} {{ l.mins }}</button></sc-for>
                      <sc-if value="{{ it.hasWait }}"><span style="font:500 10.5px 'JetBrains Mono',monospace;color:#6f685e;white-space:nowrap">+{{ it.wait }}分空檔</span></sc-if>
                    </div></sc-if>
                    <sc-if value="{{ it.hasLegNote }}"><div style="padding:0 0 7px 15px;font:400 11px/1.5 'Noto Sans TC';color:#6f685e">{{ it.legNote }}</div></sc-if>
                    <sc-if value="{{ it.hasFixed }}"><div style="padding:7px 0 7px;font:500 11px/1.5 'Noto Sans TC';color:#6f685e">↓ {{ it.fixedText }}</div></sc-if>
                  </div>
                </div>
              </sc-for>
              <button onClick="{{ openAdd }}" style="margin:8px 0 0 66px;height:46px;border:1.5px dashed rgba(34,31,26,.25);border-radius:14px;background:transparent;font:500 14px 'Noto Sans TC';color:#4d473f;cursor:pointer">＋ 新增景點／餐廳</button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ isMoney }}" hint-placeholder-val="{{ false }}">
          <div style="padding:8px 20px 28px;display:flex;flex-direction:column;gap:14px">
            <div style="display:flex;justify-content:space-between;align-items:flex-end">
              <div style="font:700 26px/1.3 'Noto Sans TC',sans-serif">旅費與分帳</div>
              <div style="display:flex;align-items:center;gap:6px;font:500 11.5px 'Noto Sans TC';color:#6f685e;padding-bottom:6px;white-space:nowrap"><span style="width:7px;height:7px;border-radius:50%;background:oklch(0.62 0.14 150);flex:none;animation:pulse 1.6s infinite"></span>{{ online }}</div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
              <span style="font:400 12px 'Noto Sans TC';color:#6f685e">{{ rateLabel }}</span>
              <div style="display:flex;gap:2px;background:rgba(34,31,26,.07);padding:3px;border-radius:10px">
                  <sc-for list="{{ curBtns }}" as="c" hint-placeholder-count="2"><button onClick="{{ c.onClick }}" style="border:0;cursor:pointer;height:30px;padding:0 12px;border-radius:8px;font:500 12.5px 'Noto Sans TC';background:{{ c.bg }};color:#221f1a;box-shadow:{{ c.shadow }};white-space:nowrap">{{ c.label }}</button></sc-for>
                </div>
            </div>
